<svg xmlns="http://www.w3.org/2000/svg" width="505.28" height="254.5" viewBox="-10 -10 505.28 254.5">
  <text x="0" y="12" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">Left, line-height 1.0. The quick brown fox jumps over the lazy dog</text>
  <text x="0" y="27" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">near the riverbank.</text>
  <text x="1.49" y="50" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">Centred, line-height 1.5. The quick brown fox jumps over the lazy dog</text>
  <text x="168.25" y="72.5" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">near the riverbank.</text>
  <text x="12.48" y="96" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">Right, line-height 1.15. The quick brown fox jumps over the lazy dog</text>
  <text x="336.5" y="113.25" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">near the riverbank.</text>
  <text x="0" y="138.5" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">Justified, line-height 1.4. The quick brown fox jumps over the lazy</text>
  <text x="0" y="159.5" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">dog near the riverbank. The quick brown fox jumps over the lazy dog</text>
  <text x="0" y="180.5" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">near the riverbank.</text>
  <text x="40" y="207.5" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">First-line indent 24, left/right indent 16. The quick brown fox jumps</text>
  <text x="16" y="228.5" font-family="Roboto" font-size="15" fill="#333333" font-weight="400" xml:space="preserve">over the lazy dog near the riverbank.</text>
