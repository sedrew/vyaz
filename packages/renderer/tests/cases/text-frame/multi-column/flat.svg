<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200">
  <text x="0" y="13" font-family="Arial" font-size="14" fill="#000" font-weight="700" xml:space="preserve">Typography</text>
  <text x="80.12" y="13" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve"> is the art and technique </text>
  <text x="0" y="29" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">of arranging type to make written </text>
  <text x="0" y="45" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">language legible, readable and </text>
  <text x="0" y="61" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">appealing.</text>
  <text x="64.61" y="61" font-family="Arial" font-size="14" fill="#000" font-weight="700" xml:space="preserve"> Layout</text>
  <text x="114.39" y="61" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve"> engine processes </text>
  <text x="0" y="77" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">text through multiple stages: </text>
  <text x="260" y="13" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">compilation, preparation, line </text>
  <text x="260" y="29" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">breaking, positioning, and validation.</text>
  <text x="260" y="52" font-family="Arial" font-size="13" fill="#444" font-weight="400" xml:space="preserve">Second paragraph</text>
  <text x="366.97" y="52" font-family="Arial" font-size="13" fill="#666" font-weight="400" xml:space="preserve"> with multi-column </text>
  <text x="260" y="67" font-family="Arial" font-size="13" fill="#666" font-weight="400" xml:space="preserve">layout enabled. Text flows from one </text>
  <text x="260" y="82" font-family="Arial" font-size="13" fill="#666" font-weight="400" xml:space="preserve">column to the next.</text>
<!-- debug overlay -->
  <rect x="0" y="0" width="500" height="200" fill="none" stroke="rgba(0,140,255,0.8)" stroke-width="1" stroke-dasharray="4,3" />
  <rect x="0" y="0" width="500" height="80" fill="none" stroke="rgba(0,180,80,0.25)" stroke-width="1" />
  <rect x="500" y="0" width="500" height="32" fill="none" stroke="rgba(0,180,80,0.25)" stroke-width="1" />
  <rect x="500" y="40" width="500" height="45" fill="none" stroke="rgba(180,0,80,0.25)" stroke-width="1" />
</svg>
