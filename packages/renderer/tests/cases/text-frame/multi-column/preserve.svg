<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200">
  <text x="0" y="13" font-family="Arial" font-size="14" fill="#000" font-weight="700" xml:space="preserve">
    <tspan x="0" font-weight="700" font-style="normal" font-family="Arial" font-size="14" fill="#000" textLength="80.12">Typography</tspan>
  </text>
  <text x="0" y="13" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">
    <tspan x="80.12" font-weight="400" font-style="normal" font-family="Arial" font-size="14" fill="#333" textLength="3.89"> </tspan>
    <tspan x="84.01" font-weight="400" font-style="normal" font-family="Arial" font-size="14" fill="#333" textLength="145.54">is the art and technique</tspan>
    <tspan x="229.55" textLength="3.89"> </tspan>
  </text>
  <text x="0" y="29" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">
    <tspan x="0" font-weight="400" font-style="normal" font-family="Arial" font-size="14" fill="#333" textLength="203.88">of arranging type to make written</tspan>
    <tspan x="203.88" textLength="3.89"> </tspan>
  </text>
  <text x="0" y="45" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">
    <tspan x="0" font-weight="400" font-style="normal" font-family="Arial" font-size="14" fill="#333" textLength="191.5">language legible, readable and</tspan>
    <tspan x="191.5" textLength="3.89"> </tspan>
  </text>
  <text x="0" y="61" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">
    <tspan x="0" font-weight="400" font-style="normal" font-family="Arial" font-size="14" fill="#333" textLength="64.61">appealing.</tspan>
  </text>
  <text x="0" y="61" font-family="Arial" font-size="14" fill="#000" font-weight="700" xml:space="preserve">
    <tspan x="64.61" font-weight="700" font-style="normal" font-family="Arial" font-size="14" fill="#000" textLength="3.89"> </tspan>
    <tspan x="68.5" font-weight="700" font-style="normal" font-family="Arial" font-size="14" fill="#000" textLength="45.89">Layout</tspan>
  </text>
  <text x="0" y="61" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">
    <tspan x="114.39" font-weight="400" font-style="normal" font-family="Arial" font-size="14" fill="#333" textLength="3.89"> </tspan>
    <tspan x="118.28" font-weight="400" font-style="normal" font-family="Arial" font-size="14" fill="#333" textLength="109.74">engine processes</tspan>
    <tspan x="228.02" textLength="3.89"> </tspan>
  </text>
  <text x="0" y="77" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">
    <tspan x="0" font-weight="400" font-style="normal" font-family="Arial" font-size="14" fill="#333" textLength="175.1">text through multiple stages:</tspan>
    <tspan x="175.1" textLength="3.89"> </tspan>
  </text>
  <text x="260" y="13" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">
    <tspan x="260" font-weight="400" font-style="normal" font-family="Arial" font-size="14" fill="#333" textLength="178.99">compilation, preparation, line</tspan>
    <tspan x="438.99" textLength="3.89"> </tspan>
  </text>
  <text x="260" y="29" font-family="Arial" font-size="14" fill="#333" font-weight="400" xml:space="preserve">
    <tspan x="260" font-weight="400" font-style="normal" font-family="Arial" font-size="14" fill="#333" textLength="226.49">breaking, positioning, and validation.</tspan>
  </text>
  <text x="260" y="52" font-family="Arial" font-size="13" fill="#444" font-weight="400" xml:space="preserve">
    <tspan x="260" font-weight="400" font-style="normal" font-family="Arial" font-size="13" fill="#444" textLength="106.97">Second paragraph</tspan>
  </text>
  <text x="260" y="52" font-family="Arial" font-size="13" fill="#666" font-weight="400" xml:space="preserve">
    <tspan x="366.97" font-weight="400" font-style="normal" font-family="Arial" font-size="13" fill="#666" textLength="3.61"> </tspan>
    <tspan x="370.58" font-weight="400" font-style="normal" font-family="Arial" font-size="13" fill="#666" textLength="100.41">with multi-column</tspan>
    <tspan x="470.99" textLength="3.61"> </tspan>
  </text>
  <text x="260" y="67" font-family="Arial" font-size="13" fill="#666" font-weight="400" xml:space="preserve">
    <tspan x="260" font-weight="400" font-style="normal" font-family="Arial" font-size="13" fill="#666" textLength="205.22">layout enabled. Text flows from one</tspan>
    <tspan x="465.22" textLength="3.61"> </tspan>
  </text>
  <text x="260" y="82" font-family="Arial" font-size="13" fill="#666" font-weight="400" xml:space="preserve">
    <tspan x="260" font-weight="400" font-style="normal" font-family="Arial" font-size="13" fill="#666" textLength="109.84">column to the next.</tspan>
